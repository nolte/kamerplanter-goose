version: "3"

vars:
  VENV: .venv
  PY: "{{.VENV}}/bin/python"
  PIP: "{{.VENV}}/bin/pip"
  # Tracks the default branch of nolte/taskfiles, the same reference the sibling
  # repositories use. Not a tag on purpose: the worktree module exists only on
  # `develop`, and the latest release (v0.1.4) ships k8s, kind, mkdocs and
  # pre-commit but predates it.
  TASK_COLLECTION_BASE: https://raw.githubusercontent.com/nolte/taskfiles/develop/src

# Remote includes are a Task experiment: every `task` invocation in this
# checkout needs TASK_X_REMOTE_TASKFILES=1, which .envrc sets. CI never calls
# `task` — it runs the same commands directly — so nothing in the quality gate
# depends on fetching a floating branch.
#
# Only `worktree` is taken from the collection. The `mkdocs` and `pre-commit`
# modules there activate a shared venv under ~/.venvs/, while this repository
# keeps its tooling in a project-local .venv; the `lint`, `docs` and `docs:serve`
# targets below are two lines each and would gain nothing but a network
# dependency from being replaced.
includes:
  # `worktree:add|remove|list|root` — parallel working copies off origin/develop,
  # per spec/project/parallel-working-copies/ in nolte/nolte-shared. The
  # `working-copy-start` skill invokes `task worktree:add -- <branch> [slug]` by
  # name, so this include is what makes that skill usable here at all.
  worktree: "{{.TASK_COLLECTION_BASE}}/taskfile-include-worktree.yaml"

  # `mkdocs:start` — the live-reload preview server on localhost:8001. It runs
  # from the shared ~/.venvs/docs, not from this repository's .venv, and that is
  # not overridable: measured against Task 3.52, an `includes.<name>.vars` entry
  # loses to the included file's own `vars:` block, so passing
  # PYTHON_VENVS_BASEDIR, PYTHON_VENV_DIR_DOCS or MKDOCS_PORT from here changes
  # nothing. Verified acceptable rather than assumed: the shared venv carries
  # mkdocs-material, mkdocs-static-i18n and the include-markdown plugin, and
  # builds this site cleanly.
  #
  # That split is deliberate. Previewing tolerates a near-version toolchain;
  # `docs` below must not, because it is the command CI runs and has to resolve
  # the exact pins in docs/requirements.txt from the project-local .venv. The
  # module ships no build task in any case — `start` is the only one upstream.
  mkdocs: "{{.TASK_COLLECTION_BASE}}/taskfile-include-mkdocs.yaml"

tasks:
  default:
    desc: List the available targets
    cmds:
      - task --list
    silent: true

  setup:
    desc: Create the project-local venv, install every install set, wire the git hooks
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.PIP}} install --upgrade pip"
      # Installed independently on purpose: requirements-dev.txt never chains
      # requirements.txt via -r, per spec/project/project-structure/
      # §Requirements file format.
      - "{{.PIP}} install -r requirements.txt"
      - "{{.PIP}} install -r requirements-dev.txt"
      - "{{.PIP}} install -r docs/requirements.txt"
      - "{{.VENV}}/bin/pre-commit install"
      - "touch {{.VENV}}/.install-stamp"
    # Keyed on the manifests, not on the venv's existence. `test -x .venv/bin/python`
    # marked setup up to date the moment the venv existed, so a Renovate bump in
    # docs/requirements.txt was never installed locally: `task docs` built green
    # against the old wheel and CI — which installs fresh — failed on the new one.
    # The two disagreed exactly when a pin moved, which is when they must agree.
    sources:
      - requirements.txt
      - requirements-dev.txt
      - docs/requirements.txt
      - .pre-commit-config.yaml
    generates:
      - "{{.VENV}}/.install-stamp"

  test:
    desc: Validate every recipe against the house pattern
    deps: [setup]
    cmds:
      - "{{.PY}} tests/validate_recipes.py"

  lint:
    desc: Run every pre-commit hook over the whole tree
    deps: [setup]
    cmds:
      - "{{.VENV}}/bin/pre-commit run --all-files"

  docs:
    desc: Build the documentation site the same way CI does
    deps: [setup]
    cmds:
      - "{{.VENV}}/bin/mkdocs build --strict"

  docs:serve:
    desc: Serve the documentation site locally with live reload (alias of mkdocs:start)
    cmds:
      - task: mkdocs:start

  check:
    desc: The aggregate quality gate — what CI runs on every pull request
    cmds:
      - task: test
      - task: lint
      - task: docs

  recipes:list:
    desc: List every discoverable recipe with its parameters
    cmds:
      - goose recipe list -v
