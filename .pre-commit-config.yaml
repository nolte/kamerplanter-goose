# See https://pre-commit.com for usage and config reference.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-d, relaxed]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Scoped to the repository's own shell scripts. `.envrc` is a direnv
        # file, not a standalone script: shellcheck cannot infer its shell and
        # reports SC2148 on every run.
        files: '^scripts/.*\.sh$'

  - repo: local
    hooks:
      # The recipe contract is the deliverable here, so it is checked on every
      # commit rather than only in CI. Runs without a Goose provider call.
      #
      # The trigger set must cover everything the validator inspects, not just
      # the recipes: it also checks skill frontmatter for
      # `disable-model-invocation`, and that project agents sit where this
      # provider can see them. A narrower pattern lets a skill or agent that
      # breaks the contract commit clean and fail only in CI.
      - id: validate-recipes
        name: validate goose recipes against the house pattern
        entry: python3 tests/validate_recipes.py
        # `language: python` rather than `system`: the script imports yaml at
        # module level, and `task setup` installs PyYAML into .venv only. Under
        # `system` the hook runs whatever python3 the PATH offers, so a machine
        # that followed the documented setup exactly fails every commit with
        # ModuleNotFoundError. It passes here by accident of this developer's
        # global site-packages.
        language: python
        # Keep in step with requirements-dev.txt by hand: Renovate's
        # pre-commit manager bumps `rev:` on remote repos and never touches
        # additional_dependencies, so a bump there would leave the Pre-commit
        # job and every local commit on the old wheel while Recipe contract
        # runs the new one. Both are required checks.
        additional_dependencies: ["PyYAML==6.0.3"]
        files: '^(recipes/|\.claude/skills/|\.claude/agents/|\.agents/agents/|tests/validate_recipes\.py$|extensions\.yaml$)'
        pass_filenames: false
