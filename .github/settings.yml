# These settings are synced to GitHub by https://probot.github.io/apps/settings/

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: kamerplanter-goose
  description: Shareable Goose recipes for Kamerplanter and Home Assistant
  homepage: https://nolte.github.io/kamerplanter-goose
  topics:
    - goose
    - mcp
    - model-context-protocol
    - kamerplanter
    - home-assistant
    - plant-care
    - ai-agents

# The inherited commons deliberately ships `required_status_checks.contexts: []`
# for develop and tells consumers to declare their own — so without this block
# the branch has no protection at all. Measured 2026-08-09: the API answered
# `Branch not protected` (404) for develop, and the `automerge` label the
# workflow keys on did not exist either. Every CI job was advisory.
#
# BOTH branches are declared, not just develop. `_extends` merges this file
# with the commons, and `branches:` is a list there carrying master and
# develop. Whether Probot replaces the list or concatenates it is not stated
# anywhere we can rely on, and the two answers differ sharply: a replace would
# have dropped master's protection entirely while this file only meant to add
# develop's contexts. Declaring both is correct under either semantics —
# replace applies exactly these two, concatenate appends them after the
# commons' pair so the later entry for each name wins.
#
# master mirrors the commons verbatim; only develop's `contexts` is new. Those
# names are the job-level `name:` values from .github/workflows/ci.yml, which
# is what GitHub reports as the check context — the job ids would silently
# never match anything.
#
# `restrictions` is kept as the commons has it. This account is a User, not an
# Organisation, and GitHub limits push restrictions to organisation-owned
# repositories; the commons documents that the Settings App skips the field
# silently for such repositories. Dropping it here would be an unforced change
# to master's declared intent, and setting it to null would differ from the
# portfolio default for no reason this repository has.
branches:
  - name: master
    protection:
      required_pull_request_reviews: null
      required_status_checks: null
      enforce_admins: true
      restrictions:
        users: []
        teams: []
        apps:
          - nolte-portfolio-app
  - name: develop
    protection:
      required_pull_request_reviews: null
      required_status_checks:
        strict: true
        contexts:
          - Recipe contract
          - Docs build
          - Pre-commit
      enforce_admins: true
      restrictions:
        users: []
        teams: []
        apps:
          - nolte-portfolio-app
