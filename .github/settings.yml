# These settings are synced to GitHub by https://probot.github.io/apps/settings/

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: kamerplanter-goose
  description: Shareable Goose recipes for Kamerplanter and Home Assistant
  homepage: https://nolte.github.io/kamerplanter-goose
  # A COMMA-SEPARATED STRING, not a YAML list. probot/settings does
  # `this.topics.split(/\s*,\s*/)` in lib/plugins/repository.js, so a list
  # raises `TypeError: this.topics.split is not a function`. That throw is why
  # nothing below ever applied — see the root-cause note in the next block.
  topics: goose, mcp, model-context-protocol, kamerplanter, home-assistant, plant-care, ai-agents

  # Declared explicitly although the commons already carry all four, so the merge
  # policy is readable at the repository that lives under it and survives a
  # commons revision that reorders these keys.
  #
  # Measured 2026-08-15: NOTHING in this file had ever reached the platform —
  # not the inherited keys and not the repo-own ones. `homepage` and `topics`
  # were empty, `description` differed verbatim from the value below, the
  # `branches:` block below had produced no classic protection on either branch
  # (404), and the merge buttons sat at GitHub's new-repository defaults. Six
  # merged feature branches had piled up.
  #
  # That 404 does NOT mean the branches are unprotected, and an earlier revision
  # of this comment wrongly said so. A repository RULESET named
  # `default-branch-protection`, created 2026-08-06 and active on `develop` and
  # `main`, requires a pull request and blocks deletion, force-pushes and
  # non-linear history. What it carries no rule for is status checks — which is
  # why every check in this repository is advisory until the block below applies.
  # `gh api repos/<owner>/<repo>/branches/<b>` reports `protected: true` from the
  # ruleset while `.../protection` 404s; the two answer different questions.
  #
  # The cause is the Settings App's trigger, not its installation, and not this
  # file. The App syncs on a push to the DEFAULT branch that touches
  # `.github/settings.yml`. That has never happened here: the file exists only on
  # `develop` (`main` still carries no `.github/` at all), its only two revisions
  # landed on 2026-08-09 while `main` was still the default branch, and no push
  # since the default moved to `develop` has touched it. Merging the commit that
  # introduced this comment is itself the first qualifying event.
  #
  # CONFIRMED by that merge (#17, 2026-08-15): the sync fired within seconds and
  # applied `description`, `homepage`, and all three merge-button keys below —
  # precisely the values that had been wrong. Labels went from 14 to 27.
  #
  # It did NOT apply everything. Left behind in the same run: `topics` (still
  # empty), the labels `automerge` and `skills`, and the entire `branches:` block
  # (both branches still 404). Partial application is not unique to this
  # repository: nolte/claude-shared declares four required contexts and has three
  # live, and `skills` is missing there too.
  #
  # Ruled out for that remainder: the commons' `master` entry is not aborting the
  # branches plugin (nolte/claude-shared has no `master` branch either and its
  # protection applies), and label colour format is not the cause (`bug` is
  # `#CC0000` in the commons and lands as `CC0000`; both missing labels carry
  # short descriptions, so the 100-character trap does not apply).
  #
  # The second trigger (#18) settled that split. Labels converged to exactly the
  # commons set — they were merely incremental. `topics` and the `branches:`
  # block did not move, so both are structural rather than transient.
  #
  # Refuted for that remainder, by comparison across three repositories:
  #   - ruleset coexistence — nolte/kamerplanter-ha carries BOTH a
  #     `default-branch-protection` ruleset and correctly applied classic
  #     protection, so one does not block the other
  #   - `required_pull_request_reviews: null` — the commons declare exactly that
  #     and it applies on nolte/kamerplanter-ha
  #   - the commons' `master` entry, `restrictions: null`, and the extra `main`
  #     entry — nolte/claude-shared has no `master` branch, sets
  #     `restrictions: null`, declares a `main` entry, and applies
  #
  # The space-free contexts in #19 changed nothing either, which exonerated them
  # and left `topics` as the only remaining lead. Reading the app's source
  # settled it — ROOT CAUSE, one fault explaining both symptoms:
  #
  #   probot/settings lib/settings.js:
  #     const { branches, ...rest } = this.config
  #     return Promise.all(Object.entries(rest).map(...))
  #       .then(() => { if (branches) return this.processSection('branches', branches) })
  #
  #   probot/settings lib/plugins/repository.js:
  #     names: this.topics.split(/\s*,\s*/)
  #
  # `branches` is deliberately deferred until every other section resolves.
  # `topics` declared as a YAML list makes the repository plugin call `.split()`
  # on an Array, which throws — after its PATCH has already succeeded. The throw
  # rejects the Promise.all, so the `.then()` carrying `branches` never runs.
  #
  # That is the whole observed pattern: description, homepage and the merge keys
  # applied (they ride the PATCH), topics never applied (the throwing call),
  # labels applied and converged over two runs (a sibling promise, unaffected),
  # branch protection never applied (gated behind the rejected Promise.all).
  #
  # So `topics` above is a comma-separated STRING. Any repository declaring it
  # as a list silently loses its entire `branches:` block — reported upstream to
  # nolte/gh-plumbing, since the commons' consumers all use the list form.
  #
  # Ruled out by controlled comparison, so nobody re-investigates them:
  #   - the short `_extends` form — nolte/kamerplanter-ha uses it and is applied,
  #     and `.github/boring-cyborg.yml` in THIS repository uses it and works
  #   - the personal-account owner type — same account, two working repositories
  #   - Probot access to this repository — Renovate opened #12/#13/#15/#16 and
  #     boring-cyborg labelled #9 and #17 while this file did nothing
  #
  # Verify after any change to this block:
  #   gh api repos/nolte/kamerplanter-goose \
  #     --jq '{description, homepage, topics, allow_squash_merge, allow_merge_commit, allow_rebase_merge, delete_branch_on_merge}'
  #   gh api repos/nolte/kamerplanter-goose/branches/develop/protection \
  #     --jq '.required_status_checks.contexts'
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true

# The inherited commons ships `required_status_checks.contexts: []` for develop
# and tells consumers to declare their own — so without this block the branch
# has no protection at all. Measured 2026-08-09: the API answered `Branch not
# protected` (404) for develop, and the `automerge` label the automerge
# workflow keys on did not exist either. Every CI job was advisory.
#
# Re-measured 2026-08-15, six days after this block landed: STILL 404, for
# `main` too, and the `automerge` label still absent. Declaring the protection
# never protected anything, because no sync had run — see the trigger analysis
# in the `repository:` block above. Treat the branch as unprotected, and every
# green check on a pull request as advisory, until the verify command above
# returns the three contexts.
#
# Probot merges `branches:` entries from `_extends` BY NAME
# (probot/settings passes `arrayMerge: mergeArrayByName`), so only the keys
# named here override the commons. An earlier revision of this file copied the
# commons' `master` block on the theory that a list might be replaced wholesale;
# that was wrong, and copying it would only have frozen this repository at one
# commons revision. `master` is also not a branch here — the pair is
# develop/main — so the commons' entry for it is an inert no-op either way.
#
# `restrictions: null` is load-bearing, not tidying. The commons declare
# `restrictions.apps: [nolte-portfolio-app]`, but GitHub accepts push
# restrictions only on ORGANISATION-owned repositories; `gh api users/nolte`
# reports `User`. On a personal account the branch-protection PUT is rejected
# outright and the Settings App drops the ENTIRE update — not just the
# unsupported field — so every context declared below would be silently
# ignored. Measured across the portfolio: nolte/gh-plumbing inherits the
# restrictions, declares three contexts and has one live; nolte/kamerplanter
# and nolte/claude-shared set `restrictions: null` and get all of theirs.
# nolte/kamerplanter's own settings.yml records the same measurement.
#
# Verify after any change to this block:
#   gh api repos/nolte/kamerplanter-goose/branches/develop/protection \
#     --jq '.required_status_checks.contexts'
#
# Context names are the job-level `name:` values from .github/workflows/ci.yml,
# which is what GitHub reports; the job ids would silently never match. They
# carry no spaces on purpose — see the note on that file's first job.
branches:
  - name: develop
    protection:
      required_pull_request_reviews: null
      required_status_checks:
        strict: true
        contexts:
          - recipe-contract
          - docs-build
          - pre-commit
      enforce_admins: true
      restrictions: null

  # main is the presentation branch that release-cd-refresh-master.yml
  # fast-forwards on release, and the branch repo_url points at. It carried no
  # protection at all (404). No required checks: nothing runs on it that does
  # not already run on develop, and a fast-forward is linear by construction.
  - name: main
    protection:
      required_pull_request_reviews: null
      required_status_checks: null
      enforce_admins: true
      required_linear_history: true
      restrictions: null
