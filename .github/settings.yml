# These settings are synced to GitHub by https://probot.github.io/apps/settings/

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: kamerplanter-goose
  description: Shareable Goose recipes for Kamerplanter and Home Assistant
  homepage: https://nolte.github.io/kamerplanter-goose
  topics:
    - goose
    - mcp
    - model-context-protocol
    - kamerplanter
    - home-assistant
    - plant-care
    - ai-agents

# The inherited commons deliberately ships `required_status_checks.contexts: []`
# for develop and tells consumers to declare their own — so without this block
# the branch has no protection at all. Measured 2026-08-09: the API answered
# `Branch not protected` (404) for develop, and the `automerge` label the
# workflow keys on did not exist either. Every CI job was advisory.
#
# Names are the job-level `name:` values from .github/workflows/ci.yml, which is
# what GitHub reports as the check context — not the job ids.
branches:
  - name: develop
    protection:
      required_status_checks:
        strict: true
        contexts:
          - Recipe contract
          - Docs build
          - Pre-commit
      enforce_admins: true
      required_pull_request_reviews: null
      restrictions: null
