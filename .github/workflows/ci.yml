name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    # Job names are the status-check contexts `.github/settings.yml` declares
    # under `branches[develop].required_status_checks`. Kept free of spaces:
    # measured 2026-08-15, a contexts list carrying spaces was the last
    # remaining difference between this repository, whose branch-protection
    # block never applied, and every portfolio repository whose block does.
    # Renaming a job renames its context and silently drops it from the
    # required set — change both files together.
    name: recipe-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install the tooling install set
        run: pip install -r requirements-dev.txt

      # `goose` is not installed on the runner, so the validator skips the
      # schema pass and checks the house-pattern rules only — the ones that
      # fail silently at runtime rather than at validate time.
      - name: Validate recipes against the house pattern
        run: python tests/validate_recipes.py

  docs:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install the docs toolchain
        run: pip install -r docs/requirements.txt

      # Same command `task docs` runs locally, so a local pass matches CI.
      - name: Build the site
        run: mkdocs build --strict

  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install the tooling install set
        run: pip install -r requirements-dev.txt

      - name: Run every hook
        run: pre-commit run --all-files --show-diff-on-failure
