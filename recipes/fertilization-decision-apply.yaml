version: "1.0.0"
title: "Fertilization Decision Apply"
description: >-
  WRITES to Kamerplanter: records one fertigation that a person carried out, as a feeding event on the plant, using only the amounts and readings the person gives. It takes the fertilisation decision the person approved (feed) and the feeding that was done, and refuses without them. It feeds nothing and measures nothing; the effect is a record, and it is not measured whether any read tool returns recorded feeding events (nolte/kamerplanter-goose#54). Must run with the working directory set to this repository checkout, because it follows the repository's house pattern for apply recipes.

parameters:
  - key: plant_key
    input_type: string
    requirement: required
    description: "Kamerplanter plant instance the feeding was given to."

  - key: tenant
    input_type: string
    requirement: optional
    default: ""
    description: >-
      Kamerplanter garden slug. Leave empty to let the run discover it from
      list_tenants; a key that covers several gardens needs it set.

  - key: decision
    input_type: string
    requirement: required
    description: >-
      The fertilisation decision a person approved, as fertilization-decision
      returned it. Only `feed` is accepted: a record that contradicts the
      decision is not written by this recipe.

  - key: volume_applied_liters
    input_type: string
    requirement: required
    description: >-
      The volume of nutrient solution the person applied, in litres, as a
      number. Required: a feeding event without an amount is not recorded.

  - key: ec_before
    input_type: string
    requirement: optional
    default: ""
    description: "EC of the solution before the feeding, as the person measured it. Leave empty if not measured."

  - key: ph_before
    input_type: string
    requirement: optional
    default: ""
    description: "pH of the solution before the feeding, as the person measured it. Leave empty if not measured."

  - key: ec_after
    input_type: string
    requirement: optional
    default: ""
    description: "EC after the feeding, as the person measured it. Leave empty if not measured."

  - key: ph_after
    input_type: string
    requirement: optional
    default: ""
    description: "pH after the feeding, as the person measured it. Leave empty if not measured."

  - key: runoff
    input_type: string
    requirement: optional
    default: ""
    description: "Runoff readings, in the person's words. Leave empty if not measured."

  - key: run_id
    input_type: string
    requirement: required
    description: >-
      Discriminator for this run, used in the idempotency key so a retry is
      traceable and does not double-write.

# No `extensions:` block on purpose — see extensions.yaml.

instructions: |
  You record one feeding that a person says they carried out, and nothing else.
  You do not decide whether to feed, you do not feed, and you do not measure.
  The decision was made and approved before you were started; your task is to
  write it down faithfully or to refuse.

  Pass on only the values the person gave. Never fill an amount, a reading or
  a field the person did not supply, and never state or imply that a plant was
  fed by this run.

prompt: |
  Record a feeding for plant "{{ plant_key }}" in garden "{{ tenant }}". Use MCP
  tools only: do not shell out, do not fetch URLs, and read or write no local
  file.

  What the person supplied (empty means not given):
  - approved decision: "{{ decision }}"
  - volume applied, litres: "{{ volume_applied_liters }}"
  - EC before: "{{ ec_before }}"
  - pH before: "{{ ph_before }}"
  - EC after: "{{ ec_after }}"
  - pH after: "{{ ph_after }}"
  - runoff: "{{ runoff }}"

  Hard constraints for this entire run:
  - Permitted by name: `mcp__kamerplanter__record_feeding_event`.
    This is the only state-changing tool this run may call, only for plant
    "{{ plant_key }}", and only with values the person supplied.
  - Forbidden by name: `mcp__kamerplanter__confirm_care_task`,
    `mcp__kamerplanter__archive_plant`, `mcp__kamerplanter__set_plant_location`,
    `mcp__kamerplanter__create_site`,
    `mcp__kamerplanter__add_plant_diary_entry`,
    `mcp__kamerplanter__claim_diary_analysis`,
    `mcp__kamerplanter__submit_diary_analysis`,
    `mcp__kamerplanter__transition_plant_phase`,
    `mcp__kamerplanter__create_inspection`,
    `mcp__kamerplanter__assign_nutrient_plan`,
    `mcp__kamerplanter__assign_species_phase_sequence`.
  - Call NO Home Assistant tool at all. Not for context, not for a reading,
    not for anything.
  - Never print an API key or token, not even partially.
  - Never pass an input the person did not supply, never invent a name for an
    optional input (read the names from the tool's own input schema), and never
    convert a unit.
  - Report a tool error verbatim and stop; do not retry with changed values.

  Step 1 — Check the approval.
  Refuse, and go straight to the report with `NOT RECORDED: <reason>`, when any
  of these holds: the approved decision is empty; it is not exactly `feed`; the
  volume is empty, is not a positive number, or is not in litres. State which
  one. Do not guess a unit, a number or a decision.

  Step 2 — Garden and permission.
  Call `mcp__kamerplanter__list_tenants`. Use "{{ tenant }}" if it is not empty
  and is among the slugs returned, otherwise the single slug returned; with
  several slugs and no given slug, refuse with `NOT RECORDED: garden not
  given`. Stop and refuse if the key lacks `mcp.write`.

  Step 3 — Dry run.
  Call `mcp__kamerplanter__record_feeding_event` with the plant, the garden,
  `volume_applied_liters` and only those of the optional values above that are
  not empty, each under the name the tool's input schema gives it, and with
  `dry_run` true. Report the planned effect as the tool returned it. A dry run
  that succeeds is not evidence that the write will succeed. If the dry run is
  rejected, report the error verbatim and refuse with `NOT RECORDED: dry run
  rejected`.

  Step 4 — Record.
  Call the same tool again with the same values, without `dry_run`, and with an
  `idempotency_key` of "feeding-{{ plant_key }}-{{ run_id }}". Report the result
  as the tool returned it, including whether it was an idempotent replay.

  Step 5 — Report.
  Print this and nothing after it:

  ## Fertilization Decision Apply — {{ plant_key }}

  | Step | Result | Detail |
  |------|--------|--------|

  One row per step above, Result being exactly OK, SKIP, or FAIL, Detail being
  one line. Then the values that were passed, one per line, and the tool result
  verbatim. Then this statement: this run wrote a record of a feeding that a
  person says they carried out; it fed nothing, and it is not measured whether
  any read tool returns recorded feeding events (nolte/kamerplanter-goose#54).

  Close with the line `RECORDED: feeding event for {{ plant_key }}` or, if
  nothing was written, `NOT RECORDED: <reason>`, as the very last line.
