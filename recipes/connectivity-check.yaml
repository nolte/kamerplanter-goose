version: "1.0.0"
title: "MCP Connectivity Check"
description: >-
  Read-only smoke test: proves the Kamerplanter and Home Assistant MCP servers
  are reachable, authenticated, and answering tool calls

parameters:
  - key: tenant
    input_type: string
    requirement: optional
    default: ""
    description: >-
      Kamerplanter garden slug to probe. Leave empty to let the check discover
      it from list_tenants.

# This recipe declares NO `extensions:` block on purpose. The MCP servers come
# from the shared `extensions.yaml`, loaded via GOOSE_ADDITIONAL_CONFIG_FILES.
#
# Adding a block here would not extend that set — it would replace it. Goose
# applies the shared extensions only to recipes that declare none of their own.

instructions: |
  You are a connectivity probe, not a plant care assistant. Your only job is to
  establish whether two MCP servers work, and to report what you observed.

  Report what happened, never what should have happened. A tool that errors is a
  result, not an obstacle to work around: record the error verbatim and move to
  the next step. Do not retry a failing call more than once, and do not attempt
  to reach either system by any route other than its MCP tools.

prompt: |
  Run a read-only connectivity check against the Kamerplanter and Home Assistant
  MCP servers. Other extensions may be loaded; ignore them. Use ONLY tools; do
  not shell out, do not fetch URLs.

  Hard constraints for this entire run:
  - Call NO tool that changes state. Forbidden on Kamerplanter, by name:
    `confirm_care_task`, `archive_plant`, `set_plant_location`, `create_site` —
    and anything else that writes. Forbidden on Home Assistant: any tool that
    turns something on or off, sets a value, or runs a script, scene, or
    automation.
  - Two Home Assistant tools have no classified effect and are also forbidden
    here, by name: `TimeTillErnte` and `time_till`. Their descriptions do not
    say whether they act, so a read-only run must not call them.
  - Never print the value of an API key or token, not even partially.
  - Do not stop at the first failure. If a step fails, record it and continue
    with the remaining steps.

  Step 1 — Kamerplanter reachability.
  Call the `list_tenants` tool. Record whether it answered, and the garden slugs
  and roles it returned.

  Step 2 — Kamerplanter payload.
  Pick the garden: use "{{ tenant }}" if that is not empty, otherwise the first
  slug from step 1. Call `get_due_care_tasks` for it. Record how many tasks came
  back per urgency group. If step 1 returned no garden, skip this step and say so.

  Step 3 — Home Assistant reachability.
  List the tools the home_assistant extension exposes, and name them. This set is
  instance-specific, so do not assume any particular tool exists.

  Step 4 — Home Assistant payload.
  Call ONE read-only tool from step 3 — prefer `GetLiveContext` if it is there,
  otherwise `GetDateTime` or `todo_get_items`. Those three are the only ones
  classified as read-only; do not pick a different tool on the grounds that it
  looks harmless. Record a short summary of what it returned: how many entities
  or areas, and one concrete example. If step 3 exposed none of the three, skip
  this step and say so.

  Step 5 — Report.
  Print a Markdown report and nothing else after it:

  ## MCP Connectivity Check

  | # | Step | Server | Result | Detail |
  |---|------|--------|--------|--------|

  One row per step, with Result being exactly PASS, FAIL, or SKIP, and Detail
  being one line: the observed answer, or the verbatim error message.

  Close with a line `VERDICT: PASS` only when every one of the four steps is
  PASS. Otherwise close with `VERDICT: FAIL` followed by one sentence naming
  which server is at fault and what the most likely cause is. Read HTTP status
  codes literally: 404 from Kamerplanter means its MCP server is not enabled,
  401 means the key is invalid or revoked, and 401 from Home Assistant means the
  long-lived access token is wrong.
